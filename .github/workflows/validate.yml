name: Validate configuration
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON examples
        run: python -m json.tool examples/realm-demo.json > /dev/null
      - name: Check operations scripts
        run: bash -n scripts/*.sh
      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          KC_BOOTSTRAP_ADMIN_PASSWORD: ci-only-not-a-secret
          KC_HOSTNAME: https://id.example.com
        run: docker compose config --quiet
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
      KC_HOSTNAME: https://id.example.com
    steps:
      - uses: actions/checkout@v5
      - name: Start identity service
        run: docker compose up -d
      - name: Verify OIDC discovery and issuer
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 5 http://127.0.0.1:8080/realms/master/.well-known/openid-configuration > discovery.json; then
              python -c 'import json; data=json.load(open("discovery.json")); assert data["issuer"] == "https://id.example.com/realms/master"'
              exit 0
            fi
            sleep 3
          done
          docker compose logs keycloak postgres
          exit 1
      - name: Clean up containers
        if: always()
        run: docker compose down -v
  oidc_flow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      KC_BOOTSTRAP_ADMIN_PASSWORD: ci-only-admin-password
      KC_HOSTNAME: https://localhost:8443
    steps:
      - uses: actions/checkout@v5
      - name: Install test dependencies
        run: python -m pip install "requests==2.32.5" "PyJWT[crypto]==2.10.1"
      - name: Generate local TLS certificate
        run: |
          mkdir -p tests/certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -keyout tests/certs/server.key -out tests/certs/server.crt -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost"
      - name: Start identity service with TLS proxy
        run: docker compose -f docker-compose.yml -f tests/docker-compose.tls.yml up -d
      - name: Wait for Keycloak through TLS proxy
        run: |
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 5 --cacert tests/certs/server.crt https://localhost:8443/realms/master/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose -f docker-compose.yml -f tests/docker-compose.tls.yml logs keycloak postgres tls-proxy
          exit 1
      - name: Exercise authorization code and PKCE
        run: python tests/oidc_flow.py
      - name: Clean up containers
        if: always()
        run: docker compose -f docker-compose.yml -f tests/docker-compose.tls.yml down -v
